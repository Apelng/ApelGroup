 /* Overlay Styles */
 .mil-card-cover {
  position: relative;

.mil-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  opacity: 0;
  transition: all 0.4s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mil-overlay-content {
  position: relative;
  padding: 20px 30px;
  border: 2px solid transparent;
  color: #fff;
  overflow: hidden;
}

.mil-overlay-content::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 2px solid #fff;
  box-sizing: border-box;
  animation: borderAnim 1.5s infinite linear;
}

@keyframes borderAnim {
  0% { clip-path: inset(0 0 95% 0); }
  25% { clip-path: inset(0 95% 0 0); }
  50% { clip-path: inset(95% 0 0 0); }
  75% { clip-path: inset(0 0 0 95%); }
  100% { clip-path: inset(0 0 95% 0); }
}

.mil-blog-card:hover .mil-overlay {
  opacity: 1;
}
